name: EngGo CI/CD Pipeline

# Kích hoạt khi có hành động PUSH hoặc MERGE vào nhánh main
on:
  push:
    branches: [ "main" ]

jobs:
  # GIAI ĐOẠN 1: TỰ ĐỘNG BIÊN DỊCH VÀ ĐÓNG GÓI IMAGE (CI)
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo code từ GitHub về máy ảo Build
        uses: actions/checkout@v4

      - name: Cài đặt môi trường Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ĐÃ SỬA: Thêm working-directory để bắt GitHub Actions chui vào thư mục enggo-backend chạy lệnh Maven
      - name: Đóng gói ứng dụng thành file JAR bằng Maven (Bỏ qua chạy test để build nhanh)
        run: mvn clean package -DskipTests
        working-directory: enggo-backend

      - name: Đăng nhập vào tài khoản Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ĐÃ SỬA: Trỏ context và file vào đúng thư mục con enggo-backend để Docker tìm thấy Dockerfile
      - name: Xây dựng Docker Image và Push lên Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./enggo-backend
          file: ./enggo-backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/enggo-backend:latest

  # GIAI ĐOẠN 2: TỰ ĐỘNG ĐIỀU KHIỂN EC2 CẬP NHẬT APP (CD)
  deploy-to-ec2:
    needs: build-and-push # Phải build thành công ở trên thì mới chạy bước này
    runs-on: ubuntu-latest
    steps:
      - name: Kết nối SSH vào EC2 và thực thi script cập nhật app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Di chuyển vào thư mục chứa docker-compose trên EC2 của Tú
            cd /home/ubuntu/enggo-project
            
            # Tải Docker Image mới nhất từ Docker Hub về
            docker compose pull enggo-backend
            
            # Khởi động lại duy nhất container backend chạy ngầm
            docker compose up -d enggo-backend
            
            # Dọn dẹp các bản image cũ bị thừa để nhẹ ổ cứng server
            docker image prune -f